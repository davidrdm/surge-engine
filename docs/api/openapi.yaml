    Confidence:
      properties:
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
          description: 0..1. A weighted sum of per-family weight x quality, not a probability.
        band:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          title: Band
          description: Cannot be HIGH when any contributing source failed.
      type: object
      required:
      - score
      - band
      title: Confidence
      description: An ALERT's score and band. NONE is impossible here by construction.
    CorrelationConfidence:
      properties:
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
        band:
          type: string
          enum:
          - NONE
          - LOW
          - MEDIUM
          - HIGH
          title: Band
          description: NONE means no band rule fired at all, which is a result rather than an absence
            of one.
      type: object
      required:
      - score
      - band
      title: CorrelationConfidence
      description: 'A CORRELATION''s score and band, which may be NONE.


        Separate from `Confidence` rather than widening it. NONE is a real computed

        outcome — "we looked and this did not reach a band" — and is stored so that

        finding nothing is on the record; but an alert is never written for one, so

        the alert contract keeps the narrower type that says so.


        Reusing the alert model here was a 500 on the very case the correlation

        routes exist to expose: a band-NONE correlation failed validation and the

        listing crashed. The tests missed it because their fixture raises

        `alert_min_score`, which produces a BELOW_FLOOR row with a real band —

        never the sub-threshold band itself.'
    CorrelationOut:
      properties:
        correlation_id:
          type: integer
          title: Correlation Id
        city:
          type: string
          title: City
        track:
          type: string
          title: Track
          description: One of the loaded mission's tracks. Not an enum in this schema because the permitted
            values come from a mission pack read at startup; `GET /v1/capabilities` reports the live set
            as `mission.tracks`.
        confidence:
          $ref: '#/components/schemas/CorrelationConfidence'
        distinct_types:
          type: integer
          title: Distinct Types
          default: 0
        data_completeness:
          type: number
          title: Data Completeness
          description: Share of the four signal families collected at all. A family counts as missing
            only when NOTHING in it was collected — see `failed_families`.
          default: 1.0
        band_capped:
          type: boolean
          title: Band Capped
          default: false
        failed_sources:
          items:
            type: string
          type: array
          title: Failed Sources
          description: Every failed collection as `SOURCE_TYPE:endpoint`, e.g. `LODGING:/search`. Finer
            than `failed_families`, and does NOT drive `data_completeness`.
        failed_families:
          items:
            type: string
          type: array
          title: Failed Families
          description: Signal families with NOTHING collected — what `data_completeness` counts. A family
            in `failed_sources` but absent here was degraded, not lost.
        rule_trace:
          type: string
          title: Rule Trace
          default: ''
        contributions:
          additionalProperties:
            type: number
          type: object
          title: Contributions
        alert_decision:
          anyOf:
          - type: string
            enum:
            - ALERTED
            - BELOW_FLOOR
            - BAND_NONE
          - type: 'null'
          title: Alert Decision
          description: 'What ALERTING concluded. BELOW_FLOOR: under `correlation.alert_min_score`. BAND_NONE:
            no band qualified. Null means ALERTING has not run for this iteration yet, which is not the
            same as deciding against.'
        alert_decision_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Alert Decision Reason
          description: The decision in words, with the numbers that produced it. Written by the agent
            that decided, so a reader does not have to hold the configuration to reconstruct it.
        alerted:
          type: boolean
          title: Alerted
          default: false
        computed_at:
          type: string
          title: Computed At
          default: ''
        evidence_url:
          type: string
          title: Evidence Url
          default: ''
      type: object
      required:
      - correlation_id
      - city
      - track
      - confidence
      title: CorrelationOut
      description: One scored city/track, whether or not it became an alert (8.7b).
    CorrelationsOut:
      properties:
        iteration_id:
          type: integer
          title: Iteration Id
        counts:
          additionalProperties:
            type: integer
          type: object
          title: Counts
        correlations:
          items:
            $ref: '#/components/schemas/CorrelationOut'
          type: array
          title: Correlations
      type: object
      required:
      - iteration_id
      title: CorrelationsOut
      description: 'Everything an iteration scored. The sub-threshold rows are the point.


        A correlation that produced no alert is the near miss, and the near misses

        are what the interim floors in `correlation` and `sensitivity` are meant to

        be calibrated from. They have no alert row, and every other route into the

        evidence surface resolves `alerts.correlation_id` first.'
    DiscardIn:
      properties:
        expect:
          anyOf:
          - type: string
          - type: 'null'
          title: Expect
        confirm:
          type: boolean
          title: Confirm
          default: false
      additionalProperties: false
      type: object
      title: DiscardIn
    DiscardOut:
      properties:
        iteration_id:
          type: integer
          title: Iteration Id
        stage:
          type: string
          title: Stage
        deleted:
          additionalProperties:
            type: integer
          type: object
          title: Deleted
        queries_reset:
          type: integer
          title: Queries Reset
          default: 0
        units_spent:
          additionalProperties:
            type: number
          type: object
          title: Units Spent
        not_reverted:
          items:
            type: string
          type: array
          title: Not Reverted
        degradations_retracted:
          type: integer
          title: Degradations Retracted
          description: Notes this stage had recorded about what it could not do, removed with its rows.
            A gap the re-run may close must not outlive the evidence for it.
          default: 0
        next_stage:
          type: string
          title: Next Stage
      type: object
      required:
      - iteration_id
      - stage
      - next_stage
      title: DiscardOut
    EpochOut:
      properties:
        epoch_id:
          type: integer
          title: Epoch Id
        started_at:
          type: string
          title: Started At
        host:
          type: string
          title: Host
        pid:
          type: integer
          title: Pid
        entry_point:
          type: string
          title: Entry Point
        ended_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Ended At
        shutdown_kind:
          anyOf:
          - type: string
            enum:
            - CLEAN
            - TIMEOUT
            - UNKNOWN
          - type: 'null'
          title: Shutdown Kind
          description: UNKNOWN is written by a LATER process onto one it found open, and leaves ended_at
            null — nothing knows when a killed process died, and inventing a time that later reads as
            fact is worse than admitting the gap.
        stranded:
          items:
            type: integer
          type: array
          title: Stranded
      type: object
      required:
      - epoch_id
      - started_at
      - host
      - pid
      - entry_point
      title: EpochOut
      description: One process instance.
    ErrorOut:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: ErrorOut
      description: 'Every non-2xx response. FastAPI''s HTTPException shape, made explicit.


        Declared so the generated schema documents the failure modes: a contract

        that lists only the success path tells a client nothing about what to

        handle, and 401, 409 and 503 are all reachable on routes whose happy path

        looks unremarkable.'
    EvidenceOut:
      properties:
        alert_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Alert Id
        correlation_id:
          type: integer
          title: Correlation Id
          default: 0
        city:
          type: string
          title: City
        track:
          type: string
          title: Track
          description: One of the loaded mission's tracks. Not an enum in this schema because the permitted
            values come from a mission pack read at startup; `GET /v1/capabilities` reports the live set
            as `mission.tracks`.
        confidence:
          $ref: '#/components/schemas/CorrelationConfidence'
        summary:
          anyOf:
          - type: string
          - type: 'null'
          title: Summary
        caveat:
          anyOf:
          - type: string
          - type: 'null'
          title: Caveat
        alert_decision:
          anyOf:
          - type: string
            enum:
            - ALERTED
            - BELOW_FLOOR
            - BAND_NONE
          - type: 'null'
          title: Alert Decision
        alert_decision_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Alert Decision Reason
        rule_trace:
          type: string
          title: Rule Trace
          default: ''
        contributions:
          additionalProperties:
            type: number
          type: object
          title: Contributions
        distinct_types:
          type: integer
          title: Distinct Types
          default: 0
        data_completeness:
          type: number
          title: Data Completeness
          description: 'Share of the four signal families that were collected at all. A family counts
            as missing only when NOTHING in it was collected (9.11): if the lodging availability endpoint
            failed and the price endpoint succeeded, lodging was measured and does not count against this.
            Compute it as `1 - len(failed_families) / 4`.'
          default: 1.0
        failed_sources:
          items:
            type: string
          type: array
          title: Failed Sources
          description: Every failed collection as `SOURCE_TYPE:endpoint` — for example `LODGING:/search`.
            The endpoint is the query's ENTRY endpoint, so a lodging pairing shortfall that happens at
            `/availability` still reports `/search`; the query row's `skip_reason` carries the precise
            cause. Where no endpoint was recorded the bare source type appears. This is finer than `failed_families`
            and does NOT drive `data_completeness`.
        failed_families:
          items:
            type: string
          type: array
          title: Failed Families
          description: Signal families with NOTHING collected. This is what `data_completeness` counts
            and what the caveat names; a family present in `failed_sources` but absent here was degraded
            rather than lost.
        band_capped:
          type: boolean
          title: Band Capped
          default: false
        alternatives:
          anyOf:
          - items:
              additionalProperties:
                type: string
              type: object
            type: array
          - type: 'null'
          title: Alternatives
          description: 'Competing explanations for this evidence, each with a stable `code`, a `statement`,
            and `weakened_by` — what in THIS correlation argues against it, empty when nothing does, because
            an unanswered alternative serves a reader better than a manufactured rebuttal. Deterministic,
            never model-written: the loaded mission supplies the explanations per signal family and the
            engine decides which of them this evidence admits, so a booking-only correlation admits ordinary-demand
            explanations that a multi-family one does not. `null` on a correlation computed before these
            rules existed; an empty list means no family contributed and there is nothing to explain away.'
        evidence_freshness:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Evidence Freshness
        flight_baseline:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Flight Baseline
        collection:
          additionalProperties:
            type: integer
          type: object
          title: Collection
          description: 'Contributing signals counted by how directly they are known, so acquisition is
            one comparable value rather than four per-family provenance fields. `DIRECT` (retrieved from
            the party that holds the record), `INTERMEDIARY_LIVE` (a vendor''s live call against a platform
            or publisher), `INTERMEDIARY_CACHED` (served from a vendor cache and billed as though fresh,
            so the ledger is no guide to freshness), `UNRECORDED` (the default, so a writer that forgets
            produces a visible absence rather than a plausible claim). Empty classes are omitted. The
            absence of `DIRECT` is the standing fact about this deployment: every provider here is an
            intermediary.'
        signals:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Signals
        receipt:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Receipt
          description: 'Provenance for the model call behind `summary`, or null when the deterministic
            fallback wrote it. A loose object because the field set follows the provider echo, but three
            keys are the point of it: `mission_hash` — compare against `mission.digest` from `GET /v1/capabilities`
            to tell whether the definition has changed since this judgement was made; `config_hash` —
            compare against `SessionOut.config_hash` for the same question about settings; and `prompt_hash`,
            which says two judgements were made under the same criteria without disclosing what they are.'
      type: object
      required:
      - city
      - track
      - confidence
      title: EvidenceOut
      description: 'Full drill-down: every contributing signal back to its raw payload.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthOut:
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          title: Status
        database:
          type: string
          title: Database
        schema_version:
          type: integer
          title: Schema Version
        dry_run:
          type: boolean
          title: Dry Run
          default: false
        debug_endpoints:
          type: boolean
          title: Debug Endpoints
          default: false
        active_sessions:
          type: integer
          title: Active Sessions
          default: 0
        running_iterations:
          items:
            type: integer
          type: array
          title: Running Iterations
        epoch_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Epoch Id
        interrupted_iterations:
          items:
            type: integer
          type: array
          title: Interrupted Iterations
        budget:
          additionalProperties:
            additionalProperties:
              type: number
            type: object
          type: object
          title: Budget
        connectors:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Connectors
        retention:
          additionalProperties:
            type: integer
          type: object
          title: Retention
      type: object
      required:
      - status
      - database
      - schema_version
      title: HealthOut
    InterruptedOut:
      properties:
        iteration_id:
          type: integer
          title: Iteration Id
        session_id:
          type: integer
          title: Session Id
        seq:
          type: integer
          title: Seq
        kind:
          type: string
          enum:
          - INTERRUPTED
          - OPEN
          title: Kind
          description: 'INTERRUPTED: a process died mid-run and the reconcile stamped it. OPEN: never
            finished by any route — a manual walk left partway, or a cancellation recorded against an
            iteration that was not on a worker. Both block a new iteration and both are closed the same
            two ways; the distinction tells you what happened, not what to do.'
          default: INTERRUPTED
        interrupted_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Interrupted At
          description: Null for kind=OPEN. Only the crash reconcile stamps it.
        interrupted_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Interrupted Stage
        stage_pointer:
          type: string
          title: Stage Pointer
          default: ''
        started_at:
          type: string
          title: Started At
          default: ''
        resume_url:
          type: string
          title: Resume Url
          default: ''
        abandon_url:
          type: string
          title: Abandon Url
          default: ''
        plan_url:
          type: string
          title: Plan Url
          default: ''
      type: object
      required:
      - iteration_id
      - session_id
      - seq
      title: InterruptedOut
    IterationAccepted:
      properties:
        iteration_id:
          type: integer
          title: Iteration Id
        session_id:
          type: integer
          title: Session Id
        seq:
          type: integer
          title: Seq
          default: 0
        status:
          type: string
          enum:
          - RUNNING
          - PENDING
          - FINISHED
          title: Status
        stage:
          type: string
          title: Stage
        poll_url:
          type: string
          title: Poll Url
        next_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Stage
        retry_of_iteration_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retry Of Iteration Id
        budget_plan:
          additionalProperties:
            type: number
          type: object
          title: Budget Plan
      type: object
      required:
      - iteration_id
      - session_id
      - status
      - stage
      - poll_url
      title: IterationAccepted
    IterationIn:
      properties:
        mode:
          type: string
          enum:
          - auto
          - manual
          title: Mode
          default: auto
      additionalProperties: false
      type: object
      title: IterationIn
      description: 'How to run the iteration being created.


        `manual` creates it and stops, for stepping through the stages one at a

        time. `auto` is the normal path and the default: agents must not solicit

        user interaction inside an iteration, so nothing between stage 1 and stage 8

        can ask for anything.'
    IterationOut:
      properties:
        iteration_id:
          type: integer
          title: Iteration Id
        session_id:
          type: integer
          title: Session Id
        seq:
          type: integer
          title: Seq
        stage:
          type: string
          title: Stage
          description: One of the eight pipeline stages, or COMPLETE / FAILED.
        outcome:
          anyOf:
          - type: string
            enum:
            - COMPLETE
            - PARTIAL
            - FAILED
          - type: 'null'
          title: Outcome
          description: Null while running. PARTIAL means the sequence finished but something was lost
            — the alerts are real findings made from incomplete evidence. FAILED means a prerequisite
            stage never ran and the alerts should not be read at all.
        running:
          type: boolean
          title: Running
          default: false
        anchor_at:
          type: string
          title: Anchor At
          description: The instant the correlation window centres on.
          default: ''
        started_at:
          type: string
          title: Started At
          default: ''
        finished_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Finished At
        next_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Stage
          description: What a debug step would run next, if any.
        counts:
          additionalProperties:
            type: integer
          type: object
          title: Counts
          description: Queries enqueued/executed/failed/skipped, and rows written per analytical table.
            `triage_decisions` here is a TOTAL; see `triage_states` for what those decisions were.
        triage_states:
          additionalProperties:
            type: integer
          type: object
          title: Triage States
          description: 'Judgements by durable outcome: `ACCEPTED`, `REJECTED`, `UNDECIDED`, `INVALID_OUTPUT`,
            `MODEL_ERROR`. Absent keys are zero. The distinction is the point and it is not recoverable
            from the total: REJECTED is a judgement that the item is not relevant, while UNDECIDED, INVALID_OUTPUT
            and MODEL_ERROR are posts that were collected and paid for and never judged — a coverage gap,
            which caps the confidence band and reaches the alert caveat. Before this field a client could
            only infer that from free-text `degradations`.'
        budget:
          additionalProperties:
            additionalProperties:
              type: number
            type: object
          type: object
          title: Budget
          description: Units billed this iteration, per provider. Always all four providers, zero included.
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - INTERRUPTED
          - FINISHED
          title: Status
          description: 'The lifecycle state, which `outcome` alone cannot give you: an interrupted iteration
            has a null outcome and is not running, and a client watching those two fields would never
            stop. Stop on FINISHED or INTERRUPTED.'
          default: PENDING
        interrupted_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Interrupted At
          description: Set when a process ended without finishing this run. It never clears, so the history
            survives a later resume.
        interrupted_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Interrupted Stage
          description: The stage that was in flight when it died.
        retry_of_iteration_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Retry Of Iteration Id
          description: Set when this iteration is a re-triage of an earlier one (8.8). It re-judged that
            iteration's unanswered posts, inherited its `anchor_at`, and did not re-collect. The parent
            is unmodified — both records stand as what each run did.
        resumable:
          type: boolean
          title: Resumable
          description: True while the iteration awaits a resume or an abandon — for a crash-interrupted
            run and equally for one merely left open. Either blocks a new iteration on this session, so
            either needs closing.
          default: false
        degradations:
          items:
            type: string
          type: array
          title: Degradations
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
      type: object
      required:
      - iteration_id
      - session_id
      - seq
      - stage
      title: IterationOut
    KeyLocationIn:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        address:
          anyOf:
          - type: string
          - type: 'null'
          title: Address
        lat:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Lat
        lon:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: 'null'
          title: Lon
        location_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Location Type
          description: One of the loaded mission's `location_types`, which `GET /v1/capabilities` reports.
            Not an enum in this schema because the permitted values come from a mission pack read at startup;
            an unknown one is refused with a 422 naming the value and listing what was allowed.
      additionalProperties: false
      type: object
      required:
      - name
      title: KeyLocationIn
    QueueOut:
      properties:
        session_id:
          type: integer
          title: Session Id
        iteration_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Iteration Id
        status_counts:
          additionalProperties:
            type: integer
          type: object
          title: Status Counts
        decision_counts:
          additionalProperties:
            type: integer
          type: object
          title: Decision Counts
        scheduled_ahead:
          type: integer
          title: Scheduled Ahead
          default: 0
        queries:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Queries
        decisions:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Decisions
      type: object
      required:
      - session_id
      title: QueueOut
    RecoveryOut:
      properties:
        epoch:
          $ref: '#/components/schemas/EpochOut'
        previous_epoch:
          anyOf:
          - $ref: '#/components/schemas/EpochOut'
          - type: 'null'
        interrupted:
          items:
            $ref: '#/components/schemas/InterruptedOut'
          type: array
          title: Interrupted
        blocking:
          items:
            $ref: '#/components/schemas/InterruptedOut'
          type: array
          title: Blocking
        refused_epochs:
          items:
            type: integer
          type: array
          title: Refused Epochs
      type: object
      required:
      - epoch
      title: RecoveryOut
      description: What the current process found when it started, and what still blocks.
    RecoveryPlanOut:
      properties:
        iteration_id:
          type: integer
          title: Iteration Id
        session_id:
          type: integer
          title: Session Id
        resume_from:
          type: string
          title: Resume From
        derived_by:
          type: string
          enum:
          - RECONCILED
          - IN_FLIGHT
          - BETWEEN_STAGES
          - NOTHING_RAN
          title: Derived By
          description: How the resume point was decided. RECONCILED is the durable one, read from the
            row the reconcile stamped.
        stage_pointer:
          type: string
          title: Stage Pointer
        interrupted_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Interrupted Stage
        paid:
          type: boolean
          title: Paid
          description: True when resuming would collect again at a vendor. `confirm_respend` is then required.
        queries_to_recollect:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Queries To Recollect
        already_banked:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Already Banked
          description: Paid for and stored before the crash. Not re-bought, and not counted as coverage
            either — a completed query with no signal reads as 'we looked and found nothing'.
        already_spent:
          additionalProperties:
            type: number
          type: object
          title: Already Spent
        estimated_units_upper_bound:
          additionalProperties:
            type: number
          type: object
          title: Estimated Units Upper Bound
          description: An upper bound, NOT a price. FR24 bills per record returned, so no pre-flight figure
            can be exact — judge from queries_to_recollect.
      type: object
      required:
      - iteration_id
      - session_id
      - resume_from
      - derived_by
      - stage_pointer
      - paid
      title: RecoveryPlanOut
      description: What resuming would do, before it does any of it.
    ResumeIn:
      properties:
        from_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: From Stage
          description: Override the derived resume point. Must not be later than it. Use discard-last-stage
            to go further back.
        confirm_respend:
          type: boolean
          title: Confirm Respend
          description: Required when the plan would collect again at a vendor. Nothing already spent is
            reclaimed.
          default: false
      additionalProperties: false
      type: object
      title: ResumeIn
      description: 'How to restart an interrupted iteration.


        Two fields and no third override. An *earlier* `from_stage` needs no extra

        ceremony — naming a stage is itself the explicit act — while a *later* one

        is refused outright, because skipping a stage that never ran is never what

        anyone wants. Collapsing two acknowledgements into one boolean is how

        confirmations stop meaning anything.'
    RetryTriageIn:
      properties:
        batch_size:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 1.0
          - type: 'null'
          title: Batch Size
          description: Posts per model call for the retry. Omit to use `triage.batch_size` — the retry
            halves it on each TruncatedResponse down to one anyway, so an override is only needed to start
            smaller than the configured value.
      additionalProperties: false
      type: object
      title: RetryTriageIn
      description: How to re-judge the posts a model failure lost (8.8).
    ReviewIn:
      properties:
        review_state:
          type: string
          enum:
          - UNREVIEWED
          - RELEASED
          - WITHHELD
          title: Review State
        reviewed_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Reviewed By
        note:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - review_state
      title: ReviewIn
      description: A human decision about DISTRIBUTION. Nothing analytical moves.
    ReviewOut:
      properties:
        alert_id:
          type: integer
          title: Alert Id
        review_state:
          type: string
          title: Review State
        reviewed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Reviewed At
        reviewed_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Reviewed By
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      type: object
      required:
      - alert_id
      - review_state
      title: ReviewOut
    SessionIn:
      properties:
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        cities:
          items:
            $ref: '#/components/schemas/CityIn'
          type: array
          title: Cities
          description: Inline jurisdictions. Omit when using `input_set`.
        input_set:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Input Set
          description: 'NAME of a file in the configured input directory (`inputs.dir`), without the extension
            — for example ''example''. Not a path: this field would otherwise be a file-disclosure primitive,
            and an authenticated caller is not thereby trusted with the filesystem. An unresolvable city
            in the file is refused by name, never silently dropped.'
        expand_cities:
          type: boolean
          title: Expand Cities
          default: false
        tracks:
          items:
            type: string
          type: array
          title: Tracks
          description: Which of the loaded mission's tracks to score. Defaults to all of them. `GET /v1/capabilities`
            reports the permitted values, which are not an enum here because they come from a mission
            pack read at startup.
        tunables:
          additionalProperties: true
          type: object
          title: Tunables
          description: 'Per-session configuration overrides, nested as in config.yaml. Settable sections:
            triage, sensitivity, correlation, windows, tipping, budget. Anything else is a 422 naming
            the field — a setting that was accepted and ignored is worse than one that was refused.'
      additionalProperties: false
      type: object
      title: SessionIn
      description: 'Initialisation. The key locations are what lodging queries anchor on.


        Give either `cities` inline or `input_set` — exactly one. The response

        echoes the resolved geography either way, so an operator can see what they

        created rather than trust that a file still says what they remember.'
    SessionOut:
      properties:
        session_id:
          type: integer
          title: Session Id
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        status:
          type: string
          title: Status
          default: ACTIVE
        created_at:
          type: string
          title: Created At
          default: ''
        expand_cities:
          type: boolean
          title: Expand Cities
          default: false
        tracks:
          items:
            type: string
          type: array
          title: Tracks
          description: Tracks defined by the loaded mission. Not an enum in this schema because the permitted
            values come from a mission pack read at startup; `GET /v1/capabilities` reports the live set
            as `mission.tracks`.
        cities:
          items:
            $ref: '#/components/schemas/CityOut'
          type: array
          title: Cities
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        tunables:
          additionalProperties: true
          type: object
          title: Tunables
          description: Per-session configuration overrides in force, normalised. Empty means every stage
            runs on the server's own configuration.
        config_hash:
          type: string
          title: Config Hash
          description: Fingerprint of the effective analytical configuration. Matches `config_hash` on
            every receipt this session's iterations produce.
          default: ''
      type: object
      required:
      - session_id
      title: SessionOut
    StageOut:
      properties:
        stage:
          type: string
          title: Stage
        status:
          type: string
          title: Status
        started_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Started At
        finished_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Finished At
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        wrote:
          additionalProperties:
            type: integer
          type: object
          title: Wrote
        decisions:
          additionalProperties:
            type: integer
          type: object
          title: Decisions
        agents:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Agents
        api_calls:
          additionalProperties:
            additionalProperties:
              type: number
            type: object
          type: object
          title: Api Calls
        log:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Log
        correlations:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Correlations
          description: What CORRELATING concluded. Each entry carries `evidence_url` — the drill-down
            works for a correlation with no alert, which is the case that had no route at all before 8.7(b).
        skips:
          additionalProperties:
            type: integer
          type: object
          title: Skips
          description: 'Why collected posts did not reach the model (8.9). STALE is a decision — older
            than `triage.max_post_age_hours`. The PAYLOAD_* and ITEM_* reasons are defects: evidence that
            was collected and paid for and then could not be read, and a PAYLOAD_* reason costs every
            post in that response. Empty for every other stage.'
      type: object
      required:
      - stage
      - status
      title: StageOut
    StagesOut:
      properties:
        iteration_id:
          type: integer
          title: Iteration Id
        stage:
          type: string
          title: Stage
        outcome:
          anyOf:
          - type: string
          - type: 'null'
          title: Outcome
        next_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Stage
        stages:
          items:
            $ref: '#/components/schemas/StageOut'
          type: array
          title: Stages
      type: object
      required:
      - iteration_id
      - stage
      title: StagesOut
    StepIn:
      properties:
        expect:
          anyOf:
          - type: string
          - type: 'null'
          title: Expect
      additionalProperties: false
      type: object
      title: StepIn
    StepOut:
      properties:
        iteration_id:
          type: integer
          title: Iteration Id
        stage:
          type: string
          title: Stage
        ok:
          type: boolean
          title: Ok
        next_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Stage
        outcome:
          anyOf:
          - type: string
          - type: 'null'
          title: Outcome
        report:
          $ref: '#/components/schemas/StageOut'
      type: object
      required:
      - iteration_id
      - stage
      - ok
      - report
      title: StepOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    BearerToken:
      type: http
      description: Static bearer token, read by the server from the environment variable named in `api.token_env`
        (default `SURGE_API_TOKEN`). Required by every operation except `GET /v1/healthz`, which is anonymous
        for liveness but requires the token when called with `?deep=true`.
      scheme: bearer
