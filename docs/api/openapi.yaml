          - type: 'null'
          title: State
        resolved:
          type: boolean
          title: Resolved
        resolved_by:
          type: string
          title: Resolved By
        airports:
          items:
            type: string
          type: array
          title: Airports
        pickup_location:
          anyOf:
          - type: string
          - type: 'null'
          title: Pickup Location
        supported_sources:
          items:
            type: string
          type: array
          title: Supported Sources
        unsupported_sources:
          items:
            type: string
          type: array
          title: Unsupported Sources
        limitations:
          items:
            type: string
          type: array
          title: Limitations
      type: object
      required:
      - name
      - resolved
      - resolved_by
      title: CapabilityCity
      description: What this deployment could actually collect for one jurisdiction.
    CitiesIn:
