    AlertOut:
      properties:
        review_state:
          type: string
          title: Review State
          default: UNREVIEWED
        alert_id:
          type: integer
          title: Alert Id
        iteration_id:
          type: integer
          title: Iteration Id
        city:
          type: string
          title: City
          description: '"Name, ST", or just the name if no state.'
        track:
          type: string
          title: Track
          description: One of the loaded mission's tracks. Not an enum in this schema because the permitted
            values come from a mission pack read at startup; `GET /v1/capabilities` reports the live set
            as `mission.tracks`.
        confidence:
          $ref: '#/components/schemas/Confidence'
          description: Computed deterministically in Python. Not a probability, and not to be presented
            to a decision-maker as one.
        summary:
          type: string
          title: Summary
          description: One or two sentences, written by a language model that is never shown the score
            and cannot change it.
        caveat:
          anyOf:
          - type: string
          - type: 'null'
          title: Caveat
          description: Deterministic disclosure, written in Python and never by the model, so it cannot
            be softened or dropped. Present when a source could not be collected — naming the family and,
            for a partial loss, the endpoint — and ALSO when this iteration contributed no evidence of
            its own, in which case it names the iteration that last did and how old the contributing signals
            are. Either can appear without the other.
        earliest_eta:
          anyOf:
          - type: string
          - type: 'null'
          title: Earliest Eta
          description: Soonest arrival among the contributing flights. The most actionable single field
            when it is present.
        created_at:
          type: string
          title: Created At
        evidence_url:
          type: string
          title: Evidence Url
          description: Drill-down to every contributing signal and the arithmetic.
        social_posts:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Social Posts
          description: Contributing social signals.
        flights:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Flights
          description: 'Contributing flights. `category_confidence: AMBIGUOUS` means the source could
            not determine the category, not that it is unknown to the operator.'
        lodging:
          items:
            additionalProperties: true
            type: object
          type: array
