openapi: 3.1.0
info:
  title: Surge I&W
  description: 'Tactical indications and warning from four independent open sources.


    Alerts correlate four independent sources — social chatter, military and charter

    flights, short-term-rental availability, and rental-car availability — into a

    deterministic confidence score. The score is computed in Python from a weighted

    model whose working is recorded per alert; a language model writes the summary

    sentence and cannot change the number.


    Read `/v1/alerts/{id}/evidence` before acting on a score. It resolves every

    contributing signal back to the raw payload and the queue row that fetched it,

    and reports the band rule that fired and any collection gap that capped it.


    **A failure is never an absence of threat.** A source that could not be

    collected lowers `data_completeness`, caps the band below HIGH, and is named in

    the alert''s caveat. An alert on a PARTIAL iteration is a real finding made from

    incomplete evidence, not a quieter one.

    '
  version: 0.6.0
paths:
  /v1/sessions:
    post:
      tags:
      - sessions
      summary: Create Session
      description: 'Initialise a session with its key locations.


        Airport and pickup mappings are resolved here rather than at tip time, so a

        city the geo table cannot place is reported as a warning before anything is

        collected. Discovering it mid-iteration would produce a SKIPPED_NO_MAPPING

        query, which is correct but arrives hours later and reads as a data gap

        rather than a setup mistake.


        **`input_set` loads the geography from a file** (8.7c) instead of inlining

        it — the NAME of a file in `inputs.dir`, never a path. The file is resolved

        all-or-nothing: a city the geo table cannot place is refused by name with a

        422, because a session quietly missing a jurisdiction would report a true

        absence of evidence about a place nobody looked at. The response echoes the

        resolved geography either way, so an operator sees what they created rather

        than trusting that a file still says what they remember.'
      operationId: create_session_v1_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: The request was understood but cannot be acted on — an unknown stage or band, a
            malformed timestamp, or a session with no cities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: SURGE_API_TOKEN is not configured; the API refuses to serve without authentication
            rather than serving without it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
      security:
      - BearerToken: []
  /v1/sessions/{session_id}:
    get:
      tags:
      - sessions
      summary: Read Session
      description: The session as configured, with its resolved geography.
      operationId: read_session_v1_sessions__session_id__get
      security:
      - BearerToken: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: No such session, iteration or alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: SURGE_API_TOKEN is not configured; the API refuses to serve without authentication
            rather than serving without it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions/{session_id}/cities:
    post:
      tags:
      - sessions
      summary: Add Cities
      description: 'Add cities between iterations, never during one.


        Refused while an iteration is in flight because stage 1 has already fixed

        the city set it will collect against; a city added mid-run would be seeded

        by the next iteration anyway, but its absence from this one''s correlation

        would be invisible.'
      operationId: add_cities_v1_sessions__session_id__cities_post
      security:
      - BearerToken: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitiesIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOut'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: No such session, iteration or alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: 'Refused because of current state: an iteration is already running for this session,
            the iteration is not at the stage you asked for, or a paid stage needs an explicit confirm.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: The request was understood but cannot be acted on — an unknown stage or band, a
            malformed timestamp, or a session with no cities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: SURGE_API_TOKEN is not configured; the API refuses to serve without authentication
            rather than serving without it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /v1/sessions/{session_id}/iterations:
    post:
      tags:
      - iterations
      summary: Trigger Iteration
      description: 'Trigger one iteration. The only thing that starts collection.


        Returns 202 and a poll URL; the run continues on a worker. `?wait=true`

        blocks up to the configured timeout for CLI use and still returns 202 if the

        run outlives it — the iteration is not abandoned, because one that has

        already paid for collection should finish and record what it bought.


        **Send an `Idempotency-Key`.** This endpoint spends money. A client that

        loses the response to a network timeout otherwise has no safe move: retry

        and it may buy a second full collection pass, don''t and there may have been

        no run at all. With a key the retry replays the first response and starts

        nothing, and the reply carries `Idempotent-Replay: true` so a caller can

        tell. Reusing a key for a *different* body is refused with 422 rather than

        silently answered with the old result.


        A 409 here is retryable and carries `Retry-After`.'
      operationId: trigger_iteration_v1_sessions__session_id__iterations_post
      security:
      - BearerToken: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          title: Session Id
      - name: wait
        in: query
        required: false
        schema:
          type: boolean
          description: Run synchronously up to api.sync_timeout_s
          default: false
          title: Wait
        description: Run synchronously up to api.sync_timeout_s
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opt-in replay protection. Repeating a POST with the same key returns the first
            response instead of starting a second run.
          title: Idempotency-Key
        description: Opt-in replay protection. Repeating a POST with the same key returns the first response
          instead of starting a second run.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/IterationIn'
              - type: 'null'
              title: Body
      responses:
        '202':
          description: Accepted; poll `poll_url` for progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IterationAccepted'
          headers:
            Idempotent-Replay:
              description: '`true` when this response is the stored reply to an earlier request carrying
                the same `Idempotency-Key`. Absent on a fresh run.'
              schema:
                type: string
        '200':
          description: Finished within ?wait=true's timeout.
          headers:
            Idempotent-Replay:
              description: '`true` when this response is the stored reply to an earlier request carrying
                the same `Idempotency-Key`. Absent on a fresh run.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IterationAccepted'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: No such session, iteration or alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: 'Refused because of current state: an iteration is already running for this session,
            the iteration is not at the stage you asked for, or a paid stage needs an explicit confirm.'
          headers:
            Retry-After:
              description: Seconds to wait before retrying. Present only when waiting helps — a 409 from
                an iteration that was never finished omits it, because that one clears only by resuming
                or abandoning the iteration.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: The request was understood but cannot be acted on — an unknown stage or band, a
            malformed timestamp, or a session with no cities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: SURGE_API_TOKEN is not configured; the API refuses to serve without authentication
            rather than serving without it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
    get:
      tags:
      - iterations
      summary: List Iterations
      description: This session's iterations, most recent first.
      operationId: list_iterations_v1_sessions__session_id__iterations_get
      security:
      - BearerToken: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          title: Session Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IterationOut'
                title: Response List Iterations V1 Sessions  Session Id  Iterations Get
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: No such session, iteration or alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: SURGE_API_TOKEN is not configured; the API refuses to serve without authentication
            rather than serving without it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/iterations/{iteration_id}:
    get:
      tags:
      - iterations
      summary: Read Iteration
      description: The poll target for the 202.
      operationId: read_iteration_v1_iterations__iteration_id__get
      security:
      - BearerToken: []
