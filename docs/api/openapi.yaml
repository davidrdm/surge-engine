    CapabilitiesOut:
      properties:
        mission:
          additionalProperties: true
          type: object
          title: Mission
          description: 'Which mission definition this deployment loaded, and the vocabularies it supplies.
            **This is where the permitted `track` and `location_type` values come from.** They are reported
            here rather than declared as enums in this schema because they are read from a mission pack
            at startup, so no fixed enum could describe them — a deployment running a different pack accepts
            different values against this same contract. Carries `id`, `version`, `digest`, `tracks` and
            `location_types`; `digest` is the hash stamped on every receipt, so a client holding an alert
            can tell whether the definition has changed since it was written. When `configured` is false
            no mission is loaded: the database and this contract are available but no iteration can run,
            and `effect` says so.'
        tracks:
          items:
            type: string
          type: array
          title: Tracks
          description: Tracks defined by the loaded mission. Not an enum in this schema because the permitted
            values come from a mission pack read at startup; `GET /v1/capabilities` reports the live set
            as `mission.tracks`.
        signal_families:
          items:
            type: string
          type: array
          title: Signal Families
        providers:
          additionalProperties:
            additionalProperties: true
            type: object
          type: object
          title: Providers
        geography:
          additionalProperties: true
          type: object
          title: Geography
        retention:
          additionalProperties: true
          type: object
          title: Retention
        cities:
          items:
            $ref: '#/components/schemas/CapabilityCity'
          type: array
          title: Cities
        open_rights_questions:
          items:
            additionalProperties:
              type: string
            type: object
          type: array
          title: Open Rights Questions
        caveats:
          items:
            type: string
          type: array
          title: Caveats
      type: object
      title: CapabilitiesOut
      description: 'What the system can and cannot do, before anyone asks it to.


        Exists so that "no alerts for this county" can be distinguished from "this

        county was never collectable". Without it the two are identical on the

        wire, and the second one silently reads as reassurance.'
    CapabilityCity:
      properties:
        name:
          type: string
          title: Name
        state:
          anyOf:
