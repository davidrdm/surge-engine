        '404':
          description: No such session, iteration or alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: SURGE_API_TOKEN is not configured; the API refuses to serve without authentication
            rather than serving without it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sessions/{session_id}/alerts:
    get:
      tags:
      - alerts
      summary: List Alerts
      description: 'The required output: alerts with their evidence, most severe first.


        `format=tuple` returns the four evidence groups as a positional array in the

        order the requirement names them, for clients that want the literal tuple

        shape rather than keys they would have to trust.


        **Unfiltered means unfiltered.** Every alert is returned regardless of

        review state, because an operator cannot review what the API hides. A

        client that distributes onward should pass `review_state=RELEASED`;

        one that shows an analyst a queue should pass `UNREVIEWED`. Defaulting to

        RELEASED here would have made an unreviewed alert invisible rather than

        unreviewed — the same failure as reporting a coverage gap as quiet.'
      operationId: list_alerts_v1_sessions__session_id__alerts_get
      security:
      - BearerToken: []
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          title: Session Id
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO-8601 lower bound
          title: Since
        description: ISO-8601 lower bound
      - name: min_confidence
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: LOW | MEDIUM | HIGH — inclusive floor
          title: Min Confidence
        description: LOW | MEDIUM | HIGH — inclusive floor
      - name: city
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: City
      - name: track
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Track
      - name: iteration_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Iteration Id
      - name: review_state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: UNREVIEWED | RELEASED | WITHHELD. A consumer distributing onward should ask for
            RELEASED.
          title: Review State
        description: UNREVIEWED | RELEASED | WITHHELD. A consumer distributing onward should ask for RELEASED.
      - name: format
        in: query
        required: false
        schema:
          type: string
          pattern: ^(named|tuple)$
          default: named
          title: Format
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/AlertOut'
                - type: array
                  items:
                    $ref: '#/components/schemas/AlertTupleOut'
                title: Response List Alerts V1 Sessions  Session Id  Alerts Get
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: No such session, iteration or alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: The request was understood but cannot be acted on — an unknown stage or band, a
            malformed timestamp, or a session with no cities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: SURGE_API_TOKEN is not configured; the API refuses to serve without authentication
            rather than serving without it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
  /v1/alerts/{alert_id}/evidence:
    get:
      tags:
      - alerts
      summary: Read Evidence
      description: 'Every contributing signal back to the raw payload and the queue row.


        This is what makes a score arguable rather than merely reported. The

        arithmetic is included — per-family weight × quality, the band rule that

        fired, and the completeness that capped it — because whoever is asked to

        act on a number is entitled to see how it was reached.


        A signal whose raw payload has passed its retention deadline shows

        `raw: null` with the query row intact. FR24''s licence requires deletion

        after 30 days; the analytical record deliberately outlives the licensed data.


        **The evidence surface is the normalised record, not the vendor payload**

        (8.2). By default `raw.payload` and the query parameters are withheld and

        described rather than returned: what may be redistributed from a provider

        response is a rights question per provider (8.3), not something this

        endpoint should assume, and the parameters carry the search lexicon and

        facility coordinates. What is always returned is everything needed to argue

        with the conclusion — the normalised signal, its provenance and receipt, the

        per-family arithmetic, and enough about the payload (provider, timestamps,

        retention deadline, content hash) to demand it through another channel.

        Set `api.expose_raw_payloads: true` to include them.'
      operationId: read_evidence_v1_alerts__alert_id__evidence_get
      security:
      - BearerToken: []
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: integer
          title: Alert Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceOut'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: No such session, iteration or alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: SURGE_API_TOKEN is not configured; the API refuses to serve without authentication
            rather than serving without it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/correlations/{correlation_id}/evidence:
    get:
      tags:
      - correlations
      summary: Read Correlation Evidence
      description: 'The same drill-down, for a correlation that produced no alert (8.7b).


        Identical shape to `GET /v1/alerts/{id}/evidence` — that endpoint now

        resolves its correlation and delegates here — with `alert_id`, `summary`,

        `caveat` and `receipt` null when no alert was written, and

        `alert_decision` saying why.


        **This is the calibration surface.** A correlation below

        `correlation.alert_min_score` is a near miss, and the near misses are what

        the interim floors in `correlation` and `sensitivity` are meant to be set

        from. Until now they were reachable only by opening the database, which also

        meant no front end could ever show one.


        Operational, not debug: an analyst tuning floors on a deployment serving

        an operations team should not have to mount the endpoint that deletes

        analytical records in order to do it. Read-only over rows that already

        exist.'
      operationId: read_correlation_evidence_v1_correlations__correlation_id__evidence_get
      security:
      - BearerToken: []
      parameters:
      - name: correlation_id
        in: path
        required: true
        schema:
          type: integer
          title: Correlation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceOut'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: No such session, iteration or alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: SURGE_API_TOKEN is not configured; the API refuses to serve without authentication
            rather than serving without it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/iterations/{iteration_id}/correlations:
    get:
      tags:
      - correlations
      summary: Read Correlations
      description: 'Every correlation this iteration scored, alerting or not.


        One row per city and actor track that produced any evidence at all. The

        ones that became alerts are reachable through `/v1/sessions/{id}/alerts`;

        the ones that did not were, before 8.7(b), reachable nowhere.


        `alert_decision` says what ALERTING concluded about each and why.

        `evidence_url` drills into any of them.'
      operationId: read_correlations_v1_iterations__iteration_id__correlations_get
      security:
      - BearerToken: []
      parameters:
      - name: iteration_id
        in: path
        required: true
        schema:
          type: integer
          title: Iteration Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrelationsOut'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: No such session, iteration or alert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: SURGE_API_TOKEN is not configured; the API refuses to serve without authentication
            rather than serving without it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/iterations/{iteration_id}/retry-triage:
    post:
      tags:
      - iterations
      summary: Retry Triage
      description: 'Re-judge the posts this iteration''s model calls never answered (8.8).


        A batch that overruns `llm.max_tokens` records **every** post in it as

        `MODEL_ERROR`: the evidence was collected and paid for, only the judgement

        is missing. This recovers those judgements and lets them tip collection.


        **It creates a NEW iteration**, a child of this one, and never edits the

        parent. The parent stays as it was — partial, degraded, its gap named — and

        the child carries `retry_of_iteration_id`. Two records in the order they

        happened rather than one rewritten after the fact.


        The child inherits the parent''s `anchor_at`, because the correlation window

        is measured from it and a fresh anchor would slide the window off the

        evidence the retry exists to complete. It runs TRIAGING through ALERTING:

        SEEDING and COLLECTING_SOCIAL are inherited rather than re-run, and

        SCHEDULING is skipped because the parent already queued follow-ons for this

        same evidence. Correlation reads signals across the session by observation

        time, so the child scores the union of both runs'' evidence without anything

        being copied.


        **Only `UNDECIDED`, `INVALID_OUTPUT` and `MODEL_ERROR` are retried.**

        ACCEPTED and REJECTED are completed judgements and a rejection is a

        conclusion, not a failure. A post dropped for being older than

        `triage.max_post_age_hours` has no decision row at all, so it cannot be

        reached — that requirement holds by construction rather than by a second

        filter that could drift from the first.


        **Send an `Idempotency-Key`.** This endpoint spends model tokens and tips

        paid collection, and it is *more* dangerous to retry blindly than the

        trigger is: the parent''s `MODEL_ERROR` rows are deliberately never edited,

        so the candidate set is unchanged by a successful retry and a repeated call

        would create another child and spend again, indefinitely. With a key the

        retry replays the first response and starts nothing.


        409 if the parent has not closed or the session has an iteration open;

        422 if there is nothing to retry.'
      operationId: retry_triage_v1_iterations__iteration_id__retry_triage_post
      security:
      - BearerToken: []
      parameters:
      - name: iteration_id
        in: path
        required: true
        schema:
          type: integer
          title: Iteration Id
      - name: wait
        in: query
        required: false
        schema:
          type: boolean
          description: Run synchronously up to api.sync_timeout_s
          default: false
          title: Wait
        description: Run synchronously up to api.sync_timeout_s
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opt-in replay protection. Repeating a POST with the same key returns the first
            response instead of starting a second retry.
          title: Idempotency-Key
        description: Opt-in replay protection. Repeating a POST with the same key returns the first response
          instead of starting a second retry.
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RetryTriageIn'
              - type: 'null'
              title: Body
      responses:
        '202':
          description: Accepted; poll `poll_url` for progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IterationAccepted'
          headers:
            Idempotent-Replay:
              description: '`true` when this response is the stored reply to an earlier request carrying
                the same `Idempotency-Key`. Absent on a fresh run.'
              schema:
                type: string
        '200':
