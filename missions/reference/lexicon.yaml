# What to search for, per track.
#
# Deliberately a table rather than a model call. The tactical lexicon is small,
# stable, and needs to be auditable: someone asking "why did you search that"
# deserves a better answer than "the model chose it".
#
# Each inner list is one query group. The engine OR-joins a group's terms and
# pairs the result with a place name, so the number of social queries a city
# costs is (groups across all tracks) x (platforms). Keep groups few and broad
# rather than many and narrow.

CONCERT_TOUR:
  - ["tour dates", "tour announcement", "concert tickets"]
  - ["stadium show", "arena show", "sold out show"]
  - ["load-in", "stage build", "production trucks"]

SPORTING_EVENT:
  - ["championship game", "playoff game", "title match"]
  - ["team charter", "travelling supporters", "away fans"]
  - ["stadium capacity", "match day", "kickoff time"]

AIRSHOW:
  - ["air show", "airshow", "flying display"]
  - ["demonstration team", "aerobatic team", "display season"]
  - ["static display", "flightline", "practice day"]
