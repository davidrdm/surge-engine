[pytest]
# `tests/` is the engine's. `missions/` is collected too, because each pack
# carries the tests for what IT claims — see missions/<name>/tests/. A pack
# mounted from outside this repository is collected the same way once
# `mission.dir` points at it; these two are simply the ones that ship here.
testpaths = tests missions
# Live tests are excluded by default. They touch real APIs, cost money, and
# depend on credentials being loaded, so opting in must be deliberate:
#   source scripts/load-secrets.sh && pytest -m live tests/test_live_smoke.py
addopts = -m "not live and not live_model"
markers =
    live: hits real external APIs; costs money; requires credentials
    live_model: calls the configured LLM; costs tokens but NO vendor credit
filterwarnings =
    error::DeprecationWarning:surge_iw.*
